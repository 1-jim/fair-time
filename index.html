<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fair Time - Wimborne RFC</title>
    <meta name="theme-color" content="#17613A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fair Time" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pitch: #17613a;
        --pitch-deep: #0f4a2b;
        --bg: #f3f6f4;
        --surface: #ffffff;
        --ink: #0f2016;
        --muted: #56665c;
        --line: #d3dcd6;
        --field: #1f8a4c;
        --field-t: #e2f2e8;
        --bench: #1d62c9;
        --bench-t: #e3ecfa;
        --next: #c98a00;
        --next-t: #fff1cc;
        --off: #c9311f;
        --off-t: #fbe1dd;
        --out: #7b8680;
        --out-t: #eceeed;
        --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c1711;
          --surface: #13231a;
          --ink: #e7f0ea;
          --muted: #9db0a4;
          --line: #27402f;
          --field: #3db36e;
          --field-t: #153525;
          --bench: #5b95f0;
          --bench-t: #172a48;
          --next: #f2b01e;
          --next-t: #3b2f0f;
          --off: #f0604f;
          --off-t: #441a18;
          --out-t: #1d2922;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c1711;
        --surface: #13231a;
        --ink: #e7f0ea;
        --muted: #9db0a4;
        --line: #27402f;
        --field: #3db36e;
        --field-t: #153525;
        --bench: #5b95f0;
        --bench-t: #172a48;
        --next: #f2b01e;
        --next-t: #3b2f0f;
        --off: #f0604f;
        --off-t: #441a18;
        --out-t: #1d2922;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.45 var(--font);
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      :focus-visible {
        outline: 3px solid var(--next);
        outline-offset: 2px;
      }

      /* Header */
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--pitch);
        color: #fff;
        box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.85);
      }
      .top .in {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 2px;
      }
      .brand {
        font: 700 24px/1 var(--cond);
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img {
        height: 44px;
        width: auto;
        filter: brightness(0) invert(1);
      }
      .crest {
        display: block;
        width: min(62vw, 260px);
        height: auto;
        margin: 6px auto 14px;
      }
      .crest.sm {
        width: min(40vw, 150px);
        margin: 0 0 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .crest {
          filter: invert(1);
        }
      }
      :root[data-theme="dark"] .crest {
        filter: invert(1);
      }
      .brand small {
        font-weight: 500;
        font-size: 17px;
        opacity: 0.75;
        margin-left: 6px;
      }
      .ib {
        background: none;
        border: 0;
        color: #fff;
        font: 700 26px/1 var(--cond);
        min-width: 44px;
        min-height: 44px;
      }
      nav.tabs {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        padding: 0 6px;
      }
      nav.tabs button {
        flex: 1;
        background: none;
        border: 0;
        color: #fff;
        opacity: 0.72;
        font: 600 18px var(--cond);
        padding: 8px 4px 11px;
        border-bottom: 4px solid transparent;
      }
      nav.tabs button[aria-current] {
        opacity: 1;
        border-color: #fff;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px 14px 120px;
      }
      h2 {
        font: 700 30px/1.1 var(--cond);
        margin: 4px 0 4px;
      }
      h3 {
        font: 600 21px/1.2 var(--cond);
        margin: 22px 0 8px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      h3 .n {
        color: var(--muted);
        font-weight: 500;
      }
      p {
        margin: 0 0 10px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 14px;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        font: 600 19px/1 var(--cond);
        text-decoration: none;
      }
      .btn.primary {
        background: var(--pitch);
        border-color: var(--pitch);
        color: #fff;
      }
      .btn.go {
        background: var(--field);
        border-color: var(--field);
        color: #fff;
      }
      .btn.warn {
        background: var(--off);
        border-color: var(--off);
        color: #fff;
      }
      .btn.big {
        min-height: 62px;
        font-size: 26px;
        width: 100%;
      }
      .btn.chalk {
        background: #fff;
        border-color: #fff;
        color: var(--pitch-deep);
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.4);
        color: #fff;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row > .btn {
        flex: 1 1 0;
      }
      .file {
        position: relative;
        overflow: hidden;
      }
      .file input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      /* Cards and panels */
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .note {
        border-left: 6px solid var(--next);
        background: var(--next-t);
        padding: 10px 12px;
        border-radius: 8px;
        margin: 10px 0;
      }
      .note.bad {
        border-color: var(--off);
        background: var(--off-t);
      }
      .note.ok {
        border-color: var(--field);
        background: var(--field-t);
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
      }
      details ol {
        margin: 8px 0 0;
        padding-left: 22px;
      }

      /* Squad list */
      .counts {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font: 600 18px var(--cond);
        margin: 12px 0 4px;
      }
      .sq-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .sq-row .nm {
        flex: 1;
        font: 600 19px var(--cond);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: var(--surface);
        padding: 0 10px;
        min-height: 40px;
        font: 600 16px var(--cond);
        color: var(--muted);
      }
      .seg button[aria-pressed="true"].going {
        background: var(--field);
        color: #fff;
      }
      .seg button[aria-pressed="true"].maybe {
        background: var(--next);
        color: #1b1400;
      }
      .seg button[aria-pressed="true"].no {
        background: var(--out);
        color: #fff;
      }
      .x {
        border: 0;
        background: none;
        color: var(--muted);
        min-width: 36px;
        min-height: 40px;
        font-size: 20px;
      }
      .add {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .add input,
      textarea,
      .inp {
        flex: 1;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        background: var(--surface);
      }
      textarea {
        width: 100%;
        min-height: 180px;
      }

      /* Steppers */
      .stp {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .stp .ctl {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stp b {
        font: 700 24px var(--cond);
        min-width: 44px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .sq {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        font: 700 22px/1 var(--cond);
      }
      .switch {
        width: 58px;
        height: 34px;
        border-radius: 17px;
        border: 0;
        background: var(--line);
        position: relative;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s;
      }
      .switch[aria-pressed="true"] {
        background: var(--field);
      }
      .switch[aria-pressed="true"]::after {
        left: 28px;
      }

      /* Tables */
      .tbl {
        overflow-x: auto;
        margin: 8px 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        text-align: right;
        white-space: nowrap;
      }
      th {
        font: 600 15px var(--cond);
        color: var(--muted);
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tr.pick {
        cursor: pointer;
      }
      tr.sel td {
        background: var(--field-t);
        font-weight: 600;
      }
      .rec {
        display: inline-block;
        margin-left: 6px;
        font: 600 13px var(--cond);
        background: var(--pitch);
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
      }
      td.hi {
        color: var(--off);
        font-weight: 600;
      }
      td.lo {
        color: var(--bench);
        font-weight: 600;
      }

      /* Teams */
      .teams {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .team {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: var(--surface);
      }
      .team .inp {
        width: 100%;
        font: 700 22px var(--cond);
        margin-bottom: 6px;
      }
      .mini {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .mini button {
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 6px;
        padding: 6px 9px;
        font: 600 16px var(--cond);
      }
      .mini button.maybe {
        border-color: var(--next);
        background: var(--next-t);
      }

      /* Scoreboard */
      .tt {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .tt button {
        flex: 1;
        min-height: 46px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        font: 600 19px var(--cond);
        position: relative;
      }
      .tt button[aria-current] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .dot {
        position: absolute;
        top: 6px;
        right: 8px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--off);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      .board {
        position: relative;
        overflow: hidden;
        background-color: var(--pitch);
        background-image:
          linear-gradient(90deg, transparent calc(50% - 1px), rgba(255, 255, 255, 0.16) calc(50% - 1px), rgba(255, 255, 255, 0.16) calc(50% + 1px), transparent calc(50% + 1px)),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.13) 0 10px, transparent 10px 20px);
        background-size: 100% 100%, 2px 100%;
        background-position: 0 0, 30% 0;
        background-repeat: no-repeat;
        color: #fff;
        border-radius: 12px;
        padding: 14px 16px 16px;
      }
      .board .stage {
        font: 600 19px var(--cond);
        opacity: 0.92;
      }
      .clock {
        font: 700 clamp(76px, 23vw, 124px)/0.92 var(--cond);
        font-variant-numeric: tabular-nums;
        letter-spacing: -1px;
        margin: 4px 0 2px;
      }
      .clock small {
        display: block;
        font-size: 18px;
        font-weight: 600;
        opacity: 0.75;
        letter-spacing: 0;
        margin-top: 4px;
      }
      .due {
        font: 600 21px/1.2 var(--cond);
      }
      .due b {
        font-variant-numeric: tabular-nums;
      }
      .board .row {
        margin-top: 14px;
      }
      .board.alert {
        background-color: #8f2317;
      }

      /* Chips */
      .chips {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 54px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        border-left: 9px solid var(--c, var(--line));
        background: var(--surface);
        text-align: left;
        color: var(--ink);
      }
      .chip .nm {
        font: 600 20px/1.1 var(--cond);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .chip.slim {
        padding: 8px 10px;
        min-width: 0;
      }
      .chip.slim .tag,
      .chip.slim .t small {
        display: none;
      }
      .btn {
        white-space: nowrap;
      }
      .board .btn {
        padding: 0 10px;
      }
      .chip .tag {
        font: 600 13px/1 var(--cond);
        padding: 3px 6px;
        border-radius: 4px;
        background: var(--c);
        color: #fff;
        white-space: nowrap;
      }
      .chip .t {
        margin-left: auto;
        text-align: right;
        font: 600 18px/1.05 var(--cond);
        font-variant-numeric: tabular-nums;
      }
      .chip .t small {
        display: block;
        font-weight: 500;
        font-size: 14px;
        color: var(--muted);
      }
      .chip.field {
        --c: var(--field);
      }
      .chip.bench {
        --c: var(--bench);
        background: var(--bench-t);
      }
      .chip.next {
        --c: var(--next);
        background: var(--next-t);
      }
      .chip.next .tag {
        color: #1b1400;
      }
      .chip.off {
        --c: var(--off);
        background: var(--off-t);
      }
      .chip.out {
        --c: var(--out);
        background: var(--out-t);
        color: var(--muted);
      }
      .swaps {
        display: grid;
        gap: 6px;
      }
      .swap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
        align-items: center;
        gap: 2px;
      }
      .swap .arr {
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 14px;
        color: var(--muted);
        margin-top: 18px;
      }
      .legend a {
        color: inherit;
      }
      .legend i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 5px;
        vertical-align: -1px;
      }

      /* Bottom bar */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: var(--surface);
        border-top: 1px solid var(--line);
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      }
      .bar .row {
        max-width: 760px;
        margin: 0 auto;
        flex-wrap: nowrap;
      }
      .bar .btn {
        padding: 0 8px;
        min-width: 0;
      }

      /* Sub call overlay */
      .call {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        padding-top: env(safe-area-inset-top, 0px);
      }
      .call-h {
        background: var(--off);
        color: #fff;
        padding: 18px 18px 14px;
      }
      .call.break .call-h {
        background: var(--pitch);
      }
      .call.plan .call-h {
        animation: flash 0.8s steps(1) 8;
      }
      @keyframes flash {
        50% {
          background: #7d1a10;
        }
      }
      .call-t {
        font: 700 clamp(44px, 12vw, 70px)/0.95 var(--cond);
      }
      .call-s {
        font: 600 20px var(--cond);
        opacity: 0.9;
        margin-top: 6px;
      }
      .call-k {
        display: grid;
        grid-template-columns: 1fr 36px 1fr;
        padding: 12px 14px 4px;
        font: 600 17px var(--cond);
        color: var(--muted);
      }
      .pairs {
        flex: 1;
        overflow: auto;
        padding: 4px 14px 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 36px 1fr;
        align-items: stretch;
        border: 0;
        padding: 0;
        background: none;
        text-align: left;
        font: 700 clamp(24px, 7vw, 34px)/1.05 var(--cond);
      }
      .pair .po,
      .pair .pi {
        padding: 14px 12px;
        border-radius: 8px;
        overflow-wrap: anywhere;
      }
      .pair .po {
        background: var(--off-t);
        border-left: 10px solid var(--off);
      }
      .pair .pi {
        background: var(--next-t);
        border-left: 10px solid var(--next);
      }
      .pair .arr {
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .pair.skip {
        opacity: 0.38;
      }
      .pair.skip .po,
      .pair.skip .pi {
        text-decoration: line-through;
      }
      .pair i {
        font-weight: 500;
        font-style: normal;
        color: var(--muted);
      }
      .call-f {
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
        background: var(--surface);
      }
      .hint {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 4px;
      }

      /* Sheets and modals */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(5, 14, 9, 0.55);
      }
      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 41;
        max-width: 760px;
        margin: 0 auto;
        max-height: 86vh;
        overflow: auto;
        background: var(--surface);
        border-radius: 16px 16px 0 0;
        padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      }
      .sheet h2 {
        margin-bottom: 2px;
      }
      .opts {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .opts .btn {
        justify-content: flex-start;
        width: 100%;
      }
      .grp {
        font: 600 15px var(--cond);
        color: var(--muted);
        margin: 14px 0 0;
      }

      /* Summary */
      .lines {
        list-style: none;
        padding: 0;
        margin: 8px 0;
        display: grid;
        gap: 6px;
      }
      .lines li {
        border-left: 6px solid var(--line);
        padding: 6px 10px;
        background: var(--surface);
        border-radius: 6px;
      }
      .lines li.inj,
      .lines li.conc {
        border-color: var(--off);
      }
      .lines li.over,
      .lines li.under,
      .lines li.late {
        border-color: var(--next);
      }
      .lines li.ok {
        border-color: var(--field);
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(86px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%) translateY(20px);
        z-index: 90;
        background: var(--ink);
        color: var(--bg);
        padding: 12px 16px;
        border-radius: 8px;
        font-weight: 600;
        max-width: 92vw;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      #toast.on {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

      /* ---------- Engine ---------- */
      const nm = (pid) => (S.players[pid] ? S.players[pid].name : pid);
      const H = () => (S.params.gameMins * MIN) / S.params.halves;
      function clock(t) {
        if (t.sim != null) return t.sim;
        return t.acc + (t.res ? Date.now() - t.res : 0);
      }
      const sess = (t) => t.base + clock(t);
      const dd = (t, pid) => Math.round((t.ps[pid].ent - t.ps[pid].on) / 5000);
      function newPS(st) {
        const g = S.params.games;
        return {
          st,
          on: 0,
          bench: 0,
          ent: 0,
          gOn: Array(g).fill(0),
          since: 0,
          maxStint: 0,
          maxBench: 0,
          started: Array(g).fill(false),
        };
      }
      function settle(t) {
        if (t.stage === "done") return;
        const c = clock(t);
        const dt = c - t.last;
        if (dt <= 0) return;
        t.last = c;
        const P = Object.values(t.ps);
        const playing = P.filter((p) => p.st === "field" || p.st === "lent");
        const av = P.filter((p) => p.st === "field" || p.st === "bench" || p.st === "lent");
        if (av.length) {
          const share = (dt * playing.length) / av.length;
          av.forEach((p) => (p.ent += share));
        }
        playing.forEach((p) => {
          p.on += dt;
          p.gOn[t.g] = (p.gOn[t.g] || 0) + dt;

        settle(t);
        const p = t.ps[pid];
        const now = sess(t);
        if (p.st === "field") p.maxStint = Math.max(p.maxStint, now - p.since);
        if (p.st === "bench") p.maxBench = Math.max(p.maxBench, now - p.since);
        p.st = st;
        p.since = now;
      }
      function logEv(t, type, o) {
        if (t.sim != null) return;
        t.log.push(Object.assign({ g: t.g, ms: clock(t), stage: t.stage, type }, o));
      }
      function lists(t) {
        const ids = Object.keys(t.ps);
        const F = ids.filter((i) => t.ps[i].st === "field");
        const B = ids.filter((i) => t.ps[i].st === "bench");
        F.sort(
          (a, b) =>
            dd(t, a) - dd(t, b) || t.ps[a].since - t.ps[b].since || nm(a).localeCompare(nm(b)),
        );
        B.sort(
          (a, b) =>
            dd(t, b) - dd(t, a) || t.ps[a].since - t.ps[b].since || nm(a).localeCompare(nm(b)),
        );
        const O = ids
          .filter((i) => !["field", "bench"].includes(t.ps[i].st))
          .sort((a, b) => nm(a).localeCompare(nm(b)));
        return { F, B, O };

      function planPairs(t, k) {
        const { F, B } = lists(t);
        const n = Math.min(k, F.length, B.length);
        const out = [];
        for (let j = 0; j < n; j++) {
          out.push({ off: F[j], on: B[j], ben: dd(t, B[j]) > dd(t, F[j]) });
        }
        return out;

      function breakPairs(t) {
        const { F, B } = lists(t);
        const inF = new Set(F);
        const pool = [...F, ...B].sort(
          (a, b) =>
            dd(t, b) - dd(t, a) ||
            (inF.has(a) ? 1 : 0) - (inF.has(b) ? 1 : 0) ||
            t.ps[a].since - t.ps[b].since ||
            nm(a).localeCompare(nm(b)),
        );
        const want = new Set(pool.slice(0, S.params.onField));
        const ons = pool.filter((i) => want.has(i) && !inF.has(i));
        const offs = F.filter((i) => !want.has(i));
        let pairs = [];
        for (let j = 0; j < Math.max(ons.length, offs.length); j++) {
          pairs.push({ off: offs[j] || null, on: ons[j] || null, ben: true });
        }
        if (!S.params.breakReshuffle) {
          const swaps = pairs.filter((p) => p.off && p.on).slice(0, t.k);
          pairs = swaps.concat(pairs.filter((p) => !p.off || !p.on));

        const step = iv * MIN;

        for (let m = 1; m * step < h - 20000; m++) out.push(m * step);

        if (t.callType === "break") {

      /* ---------- Strategy simulator ---------- */
      function simulate(n, k, iv) {
        const P = S.params;
        const h = H();
        const t = { g: 0, stage: "sim", acc: 0, res: null, last: 0, base: 0, sim: 0, ps: {}, k, interval: iv, log: [] };
        for (let i = 0; i < n; i++) t.ps["~" + String(i).padStart(2, "0")] = newPS("bench");
        let stops = 0;
        for (let g = 0; g < P.games; g++) {
          t.g = g;
          t.sim = 0;
          t.last = 0;
          for (let hh = 0; hh < P.halves; hh++) {
            const hs = hh * h;
            t.sim = hs;
            settle(t);
            apply(t, breakPairs(t), "break");
            for (const o of offsets(iv)) {
              t.sim = hs + o;
              settle(t);
              const pr = planPairs(t, k).filter((p) => p.ben);
              if (pr.length) {
                apply(t, pr, "sub");
                stops++;
              }
            }
            t.sim = hs + h;
            settle(t);
          }
          t.base += t.sim;
        }
        const end = t.base;
        const ps = Object.values(t.ps);
        const on = ps.map((p) => p.on);
        const mb = Math.max(...ps.map((p) => Math.max(p.maxBench, p.st === "bench" ? end - p.since : 0)));
        return { spread: Math.max(...on) - Math.min(...on), stops, maxBench: mb };
      }
      function strategies(n) {
        const P = S.params;

        if (bench <= 0) return [];
        const key = [n, P.onField, P.gameMins, P.games, P.halves, P.breakReshuffle].join("|");
        if (UI.simCache[key]) return UI.simCache[key];
        const hm = P.gameMins / P.halves;
        const ivs = [...new Set([2, 3, 4, 5, 6, 8, hm / 2, hm / 3, hm / 4].map((x) => Math.round(x * 60) / 60))].filter(
          (iv) => iv >= 1.5 && iv < hm,
        );
        const out = [];
        for (let k = 1; k <= Math.min(bench, 6); k++) {
          for (const iv of ivs) out.push({ k, iv, ...simulate(n, k, iv) });
          if (!P.breakReshuffle || k === Math.min(bench, 6)) {
            out.push({ k: P.breakReshuffle ? bench : k, iv: 0, ...simulate(n, P.breakReshuffle ? bench : k, 0) });
          }
        }
        out.forEach((r) => {
          r.score = (r.spread / MIN) * 3 + r.stops * 0.4 + (r.maxBench / MIN) * 0.15;

        out.sort((a, b) => a.score - b.score);
        UI.simCache[key] = out;
        return out;

      function mapResp(s) {

      /* Built-in .xlsx / .csv reader: no external library, works offline */
      async function inflateRaw(bytes) {
        if (typeof DecompressionStream === "undefined") throw new Error("NO_INFLATE");

              const type = c.getAttribute("t");

      }
      function readCsv(text) {

      async function readSheets(file) {

      /* ---------- Summaries ---------- */
      function summaryLines(t, tm, gOnly) {
        const P = S.params;
        const L = [];
        const ids = tm.pids.filter((p) => t.ps[p]);
        const at = (e) => `${fmt(e.ms)} into game ${e.g + 1}`;
        ids.forEach((pid) => {
          const mine = t.log.filter((e) => e.pid === pid);
          mine.forEach((e, i) => {
            if (gOnly != null && e.g !== gOnly) return;
            const nmx = nm(pid);
            if (e.type === "injured") {
              const back = mine.slice(i + 1).find((x) => x.type === "returned");

                k: "inj",

        });

          if (pl.length) {
            const byOn = pl.slice().sort((a, b) => t.ps[b].gOn[gOnly] - t.ps[a].gOn[gOnly]);
            const hi = byOn[0];
            const lo = byOn[byOn.length - 1];
            L.push({ k: "", txt: `Most time: ${nm(hi)} ${fmt(t.ps[hi].gOn[gOnly])}. Least: ${nm(lo)} ${fmt(t.ps[lo].gOn[gOnly])}.` });

        const over = clean.filter((p) => diff(p) >= thr).sort((a, b) => diff(b) - diff(a));

      function stepper(label, k, sfx, lock) {
        const P = S.params;
        return `<div class="stp"><span>${label}</span><div class="ctl">${lock ? "" : `<button class="sq" data-a="param" data-k="${k}" data-s="-1" aria-label="Fewer">−</button>`}<b>${P[k]}${sfx || ""}</b>${lock ? "" : `<button class="sq" data-a="param" data-k="${k}" data-s="1" aria-label="More">+</button>`}</div></div>`;
      }
      function stratTable(n, curK, curIv, action) {
        const rows = strategies(n);
        const P = S.params;
        if (n - P.onField <= 0) {
          return `<p class="muted">${n} players for ${P.onField} spots: ${n < P.onField ? "you'll play short" : "everyone plays the whole time"}, so no rotation is needed.</p>`;
        }
        let show = rows.slice(0, 5);
        const cur = rows.find((r) => r.k === curK && r.iv === curIv);
        if (cur && !show.includes(cur)) show.push(cur);
        return `<div class="tbl"><table><thead><tr><th>Plan for ${n} players</th><th>Fairness gap</th><th>Stoppages</th><th>Longest rest</th></tr></thead><tbody>${show
          .map(
            (r, i) =>
              `<tr class="pick ${r === cur ? "sel" : ""}" data-a="${action}" data-k="${r.k}" data-i="${r.iv}"><td>${stratLabel(r.k, r.iv)}${i === 0 ? '<span class="rec">Best</span>' : ""}</td><td>${fmt(r.spread)}</td><td>${r.stops}</td><td>${fmt(r.maxBench)}</td></tr>`,
          )
          .join("")}</tbody></table></div>
          <p class="small muted"><a href="guide.html#choosing-a-substitution-plan">How to choose a plan</a>. Fairness gap is the difference between most and least time played across the whole day if nobody drops out. Stoppages count changes during play (breaks are free).</p>`;
      }
      function viewSetup() {
        const P = S.params;
        const lock = S.started;
        if (!S.teams.length && S.order.length) splitTeams("az");
        let h = `<h2>Setup</h2>`;
        if (lock) h += `<div class="note">Match day is under way. These settings are locked; change the substitution plan per team from the Match screen.</div>`;
        h += `<div class="panel">
          ${stepper("Teams", "teams", "", lock)}
          ${stepper("Players on the pitch", "onField", "", lock)}
          ${stepper("Minutes per game", "gameMins", "", lock)}
          ${stepper("Games per team", "games", "", lock)}
          ${stepper("Halves per game", "halves", "", lock)}
          <div class="stp"><span>Full reshuffle at half-time and between games</span><button class="switch" aria-pressed="${P.breakReshuffle}" data-a="toggleBreak" ${lock ? "disabled" : ""} aria-label="Full reshuffle at breaks"></button></div>
          ${stepper("Flag anyone this far from fair share (min)", "outlier", "", false)}
        </div>`;
        const sizes = [...new Set(S.teams.map((tm) => tm.pids.filter((p) => S.players[p].resp === "going").length))];
        if (!lock && !S.stratPicked && sizes.length) {
          const best = strategies(Math.max(...sizes))[0];
          if (best) {
            P.k = best.k;
            P.interval = best.iv;
          }
        }
        h += `<h3>Substitution plan</h3>`;
        if (!lock) {
          h += `<p class="muted">Pick a plan. Each one was run through a full match day to see how evenly it shares time.</p>`;
          sizes.forEach((n) => (h += stratTable(n, P.k, P.interval, "pickStrat")));
          h += `<p>Selected: <b>${stratLabel(P.k, P.interval)}</b></p>`;
        } else {
          h += `<p>Starting plan: <b>${stratLabel(P.k, P.interval)}</b></p>`;
        }
        h += `<h3>Teams</h3>`;
        if (!lock) {
          h += `<div class="row" style="margin-bottom:10px"><button class="btn" data-a="split" data-m="az">Split A to Z</button><button class="btn" data-a="split" data-m="shuffle">Shuffle</button></div><p class="small muted">Tap a name to move them to the next team. Amber names haven't confirmed and start as not arrived.</p>`;
        }
        h += `<div class="teams">${S.teams
          .map((tm, i) => {
            const g = tm.pids.filter((p) => S.players[p].resp === "going").length;
            const warn = g < P.onField ? `<div class="note bad small">Only ${g} confirmed for ${P.onField} spots.</div>` : "";
            return `<div class="team"><input class="inp" value="${esc(tm.name)}" data-ch="teamName" data-i="${i}" aria-label="Team name" ${lock ? "disabled" : ""}>
              <div class="muted small">${tm.pids.length} players, ${g} confirmed, bench of ${Math.max(0, g - P.onField)}</div>${warn}
              <div class="mini">${tm.pids
                .slice()
                .sort((a, b) => nm(a).localeCompare(nm(b)))
                .map((p) => `<button class="${S.players[p].resp === "maybe" ? "maybe" : ""}" data-a="moveChip" data-p="${p}" ${lock ? "disabled" : ""}>${esc(nm(p))}</button>`)
                .join("")}</div></div>`;
          })
          .join("")}</div>`;
        if (!lock) h += `<div style="margin-top:18px"><button class="btn primary big" data-a="startDay" ${S.teams.length ? "" : "disabled"}>Start match day</button></div>`;
        return h;
      }
      function dueText(t) {
        if (t.stage === "pre") return t.interval ? `First change ${fmt(t.interval * MIN)} after kick-off` : "Changes at breaks only";
        if (t.stage === "ht") return "Half-time";
        if (t.stage === "ft" || t.stage === "done") return "Full-time";
        if (!t.interval) return "Changes at breaks only";
        const due = nextDue(t);
        const c = clock(t);
        if (c - t.halfStart >= H()) return "Time's up for this half";
        if (due == null) return "No more changes this half";
        return due - c <= 0 ? "Change due now" : `Next change in ${fmt(due - c)}`;
      }
      function chip(t, pid, cls, tag) {
        const p = t.ps[pid];
        const out = !["field", "bench"].includes(p.st);
        return `<button class="chip ${cls}" data-a="player" data-t="${t.id}" data-p="${pid}">
          <span class="nm">${esc(nm(pid))}</span>${tag ? `<span class="tag">${tag}</span>` : ""}
          <span class="t"><span data-live="pm:${t.id}:${pid}">${fmt(p.on)}</span><small>${out ? esc(ST_LABEL[p.st]) : `<span data-live="df:${t.id}:${pid}">${fmtS(p.on - p.ent)}</span>`}</small></span></button>`;
      }
      function viewGame() {
        const P = S.params;
        const tm = S.teams[S.active];
        const t = S.T[tm.id];
        const L = lists(t);
        let h = "";
        if (S.teams.length > 1) {
          h += `<div class="tt">${S.teams
            .map((x, i) => `<button data-a="team" data-i="${i}" ${i === S.active ? 'aria-current="true"' : ""}>${esc(x.name)}${S.T[x.id].callType === "plan" && i !== S.active ? '<span class="dot" aria-label="Change due"></span>' : ""}</button>`)
            .join("")}</div>`;
        }
        const c = clock(t);
        const into = c - t.halfStart;
        const ot = t.stage === "running" && into >= H();
        const half = P.halves > 1 ? (t.half === 1 ? ", 1st half" : ", 2nd half") : "";
        const gl = `Game ${Math.min(t.g + 1, P.games)} of ${P.games}`;
        const stage = {
          pre: `${gl}: ready to kick off`,
          running: gl + half,
          paused: `${gl}${half}: paused`,
          ht: `${gl}: half-time`,
          ft: `${gl}: full-time`,
          done: "All games finished",
        }[t.stage];
        let ctr = "";
        const endBtn = P.halves > 1 && t.half === 1 ? `<button class="btn ${ot ? "chalk" : "ghost"}" data-a="halftime">Half-time</button>` : `<button class="btn ${ot ? "chalk" : "ghost"}" data-a="fulltime">Full-time</button>`;
        if (t.stage === "pre") {
          ctr = `<button class="btn chalk big" data-a="kickoff">Kick off</button>`;
          if (t.g > 0) ctr += `<button class="btn ghost" data-a="reopen">Game changes</button>`;
        } else if (t.stage === "running") {
          ctr = `<button class="btn ghost" data-a="pause">Pause</button><button class="btn ghost" data-a="subNow">Sub now</button>${endBtn}`;
        } else if (t.stage === "paused") {
          ctr = `<button class="btn chalk" data-a="resume">Resume</button><button class="btn ghost" data-a="subNow">Sub now</button>${endBtn}`;
        } else if (t.stage === "ht") {
          ctr = `<button class="btn chalk big" data-a="secondHalf">Start 2nd half</button><button class="btn ghost" data-a="reopen">Half-time changes</button>`;
        } else if (t.stage === "ft") {
          ctr = t.g + 1 < P.games ? `<button class="btn chalk big" data-a="nextGame">Set up game ${t.g + 2}</button>` : `<button class="btn chalk big" data-a="nextGame">Finish the day</button>`;
        } else {
          ctr = `<button class="btn chalk big" data-a="go" data-v="summary">See the summary</button>`;
        }
        h += `<section class="board ${ot ? "alert" : ""}" aria-label="Match clock">
          <div class="stage">${stage}</div>
          <div class="clock"><span data-live="clock:${t.id}">${fmt(c)}</span><small>of ${P.gameMins}:00</small></div>
          <div class="due" data-live="due:${t.id}">${dueText(t)}</div>
          <div class="muted" style="color:rgba(255,255,255,.8)">${stratLabel(t.k, t.interval)}</div>
          <div class="row">${ctr}</div></section>`;
        if (ot) h += `<div class="note bad">Time's up. Tap ${P.halves > 1 && t.half === 1 ? "Half-time" : "Full-time"} when the whistle goes.</div>`;
        const fill = fillPairs(t);
        if (["running", "paused", "pre", "ht"].includes(t.stage)) {
          if (fill.length) {
            h += `<div class="note bad">Playing short. Bring on ${joinList(fill.map((p) => esc(nm(p.on))))}. <div style="margin-top:8px"><button class="btn warn" data-a="fillNow">Bring on now</button></div></div>`;
          } else if (L.F.length < P.onField) {
            h += `<div class="note bad">Playing with ${L.F.length} and nobody on the bench.</div>`;
          }
        }
        if (t.stage === "ft") {
          h += `<h3>Game ${t.g + 1} recap</h3><ul class="lines">${summaryLines(t, tm, t.g)
            .map((l) => `<li class="${l.k}">${esc(l.txt)}</li>`)
            .join("")}</ul>`;
        }
        let plan = [];
        let planHead = "Next change";
        if (["running", "paused"].includes(t.stage)) {
          plan = nextDue(t) != null ? planPairs(t, t.k).filter((p) => p.ben) : [];
          if (!plan.length) {
            plan = breakPairs(t).filter((p) => p.off && p.on);
            planHead = P.halves > 1 && t.half === 1 ? "Likely at half-time" : t.g + 1 < P.games ? "Likely before the next game" : "";
            if (!planHead) plan = [];
          }
        } else if (t.stage === "pre" || t.stage === "ht") {
          plan = planPairs(t, t.k).filter((p) => p.ben);
          planHead = "First change after the restart";
          if (t.stage === "pre" && t.g === 0) plan = planPairs(t, t.k);
        }
        const offN = new Set(plan.map((p) => p.off));
        const onN = new Set(plan.map((p) => p.on));
        if (plan.length) {
          h += `<h3>${planHead} <span class="n">${plan.length} swap${plan.length > 1 ? "s" : ""}</span></h3><div class="swaps">${plan
            .map((p) => `<div class="swap">${chip(t, p.off, "off slim", "")}<span class="arr">${ARROW}</span>${chip(t, p.on, "next slim", "")}</div>`)
            .join("")}</div>`;
        }
        h += `<h3>On the pitch <span class="n">${L.F.length} of ${P.onField}</span></h3><div class="chips">${L.F.map((pid) =>
          offN.has(pid) ? chip(t, pid, "off", "Off next") : chip(t, pid, "field", ""),
        ).join("")}</div>`;
        h += `<h3>Bench <span class="n">${L.B.length}</span></h3>${L.B.length ? `<div class="chips">${L.B.map((pid) => (onN.has(pid) ? chip(t, pid, "next", "On next") : chip(t, pid, "bench", ""))).join("")}</div>` : `<p class="muted">Nobody on the bench.</p>`}`;
        if (L.O.length) h += `<h3>Not available <span class="n">${L.O.length}</span></h3><div class="chips">${L.O.map((pid) => chip(t, pid, "out", "")).join("")}</div>`;
        h += `<div class="legend"><span><i style="background:var(--field)"></i>On the pitch</span><span><i style="background:var(--bench)"></i>Bench</span><span><i style="background:var(--next)"></i>On next</span><span><i style="background:var(--off)"></i>Off next</span><span>Numbers: time played, then ahead (+) or behind (-) fair share</span><a href="guide.html#3-on-the-touchline">Match day help</a></div>`;
        h += `<div class="bar"><div class="row"><button class="btn" data-a="undo" ${t.undo.length ? "" : "disabled"}>Undo</button><button class="btn" data-a="stratOpen">Sub plan</button><button class="btn" data-a="modal" data-m="add">Add player</button></div></div>`;
        return h;
      }
      function viewSummary() {
        const P = S.params;
        let h = `<img class="crest sm" src="${LOGO}" alt="Wimborne RFC crest"><h2>Summary</h2><p class="muted">${esc(S.eventName || "Match day")}${S.eventDate ? ", " + esc(S.eventDate) : ""}</p>`;
        h += `<div class="row" style="margin:12px 0"><button class="btn" data-a="shareText">Share summary</button><button class="btn" data-a="exportCSV">Export CSV</button><button class="btn" data-a="exportJSON">Backup (JSON)</button></div>`;
        S.teams.forEach((tm) => {
          const t = S.T[tm.id];
          if (!t) return;
          settle(t);
          h += `<h3>${esc(tm.name)}</h3><ul class="lines">${summaryLines(t, tm)
            .map((l) => `<li class="${l.k}">${esc(l.txt)}</li>`)
            .join("")}</ul>`;
          const thr = P.outlier * MIN;
          const ids = tm.pids.filter((p) => t.ps[p]).sort((a, b) => t.ps[a].on - t.ps[a].ent - (t.ps[b].on - t.ps[b].ent));
          h += `<div class="tbl"><table><thead><tr><th>Player</th>${Array.from({ length: P.games }, (_, i) => `<th>G${i + 1}</th>`).join("")}<th>Total</th><th>Fair</th><th>+/-</th></tr></thead><tbody>${ids
            .map((pid) => {
              const p = t.ps[pid];
              const d = p.on - p.ent;
              const cls = d >= thr ? "hi" : -d >= thr ? "lo" : "";
              const st = p.st === "field" || p.st === "bench" ? "" : ` <span class="muted small">(${esc(ST_LABEL[p.st])})</span>`;
              return `<tr><td>${esc(nm(pid))}${st}</td>${p.gOn.map((x) => `<td>${fmt(x)}</td>`).join("")}<td><b>${fmt(p.on)}</b></td><td>${fmt(p.ent)}</td><td class="${cls}">${fmtS(d)}</td></tr>`;
            })
            .join("")}</tbody></table></div>`;
        });
        h += `<p class="small muted">Fair share is each player's slice of the pitch time while they were available, so late arrivals and injuries are accounted for.</p>`;
        return h;
      }
      function callOverlay(t, tm) {

        const title =
          t.callType === "plan" ? (pairs.length ? `Swap ${n} now` : "No swaps needed") : t.stage === "ht" ? "Half-time changes" : `Changes for game ${t.g + 1}`;

          .map(
            (p) =>

        const sub = [S.teams.length > 1 ? esc(tm.name) : "", t.callType === "plan" ? `Clock <span data-live="clock:${t.id}">${fmt(clock(t))}</span>` : ""].filter(Boolean).join(", ");
        return `<div class="call ${t.callType}" role="dialog" aria-modal="true" aria-label="${esc(title)}">

          ${pairs.length ? `<div class="call-k"><span>Coming off</span><span></span><span>Going on</span></div>` : ""}

          <div class="call-f">${pairs.length ? '<p class="hint">Tap a pair to leave it out.</p>' : ""}

            <div class="row">${t.callType === "plan" ? `<button class="btn" data-a="callSnooze">Wait 30 sec</button><button class="btn" data-a="callSkip">Skip this change</button>` : `<button class="btn" data-a="callSkip">Skip changes</button>`}</div>
          </div></div>`;
      }
      function sheetView() {
        const t = S.T[UI.sheet.t];

        } else if (p.st === "bench") {
          if (L.F.length) o += `<div class="grp">Bring on for</div>` + L.F.map((x) => b("swapWith", esc(nm(x)) + ` <span class="muted small">${fmt(t.ps[x].on)}</span>`, `data-o="${x}"`)).join("");
          if (L.F.length < S.params.onField) o += b("setst", "Put on the pitch (empty spot)", 'data-s="field"', "go");

        } else if (m === "add") {
          inner = `<h2>Add a player</h2><p class="muted">They go on the bench with a fair share counted from now.</p><div class="add"><input id="addLate" placeholder="Name" autocomplete="off"></div><div class="row" style="margin-top:10px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="addLate">Add to ${esc(S.teams[S.active].name)}</button></div>`;
        } else if (m === "strat") {
          const t = S.T[S.teams[S.active].id];
          const n = lists(t).F.length + lists(t).B.length;

          inner = `<h2>Sub plan</h2><p class="muted">Changes apply from now for ${esc(S.teams[S.active].name)}. Based on ${n} available players.</p>
            <div class="stp"><span>Players per change</span><div class="ctl"><button class="sq" data-a="stratStep" data-f="k" data-s="-1">−</button><b>${s.k}</b><button class="sq" data-a="stratStep" data-f="k" data-s="1">+</button></div></div>
            <div class="stp"><span>Minutes between changes (0 = breaks only)</span><div class="ctl"><button class="sq" data-a="stratStep" data-f="iv" data-s="-1">−</button><b>${s.iv % 1 ? fmt(s.iv * MIN) : s.iv}</b><button class="sq" data-a="stratStep" data-f="iv" data-s="1">+</button></div></div>
            ${stratTable(n, s.k, s.iv, "stratPick")}
            <div class="row" style="margin-top:10px"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="stratApply">Use ${stratLabel(s.k, s.iv).toLowerCase()}</button></div>`;
        }
        return `<div class="scrim" data-a="closeModal"></div><div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
      }
      function layer() {
        let h = "";
        if (S.view === "game" && S.started) {
          const tm = S.teams[S.active];
          const t = S.T[tm.id];
          if (t.callType) h += callOverlay(t, tm);
        }
        if (UI.sheet) h += sheetView();
        if (UI.modal) h += modalView();
        return h;
      }
      let lastSig = "";
      function gameSig() {
        return (
          S.teams
            .map((tm) => {
              const t = S.T[tm.id];
              const L = lists(t);
              const due = nextDue(t);
              const c = clock(t);
              const ot = t.stage === "running" && c - t.halfStart >= H();
              const cp = t.callType ? callPairs(t).map((p) => (p.chk ? 1 : 0)).join("") : "";
              const pl = ["running", "paused"].includes(t.stage)
                ? planPairs(t, t.k).map((p) => (p.ben ? 1 : 0)).join("") + breakPairs(t).map((p) => p.on + p.off).join()
                : "";
              return [t.stage, t.callType, (t.toggle || []).join(), L.F.join(), L.B.join(), L.O.map((i) => i + t.ps[i].st).join(), ot, due != null && due <= c, cp, pl, t.k, t.interval, t.undo.length].join("/");
            })
            .join("|") +
          S.active +
          (UI.sheet ? JSON.stringify(UI.sheet) : "") +
          (UI.modal || "")
        );
      }
      function liveUpdate() {
        document.querySelectorAll("[data-live]").forEach((el) => {
          const [k, tid, pid] = el.dataset.live.split(":");
          const t = S.T[tid];
          if (!t) return;
          let v = "";
          if (k === "clock") v = fmt(clock(t));
          else if (k === "due") v = dueText(t);
          else if (k === "pm") v = fmt(t.ps[pid] ? t.ps[pid].on : 0);
          else if (k === "df") v = t.ps[pid] ? fmtS(t.ps[pid].on - t.ps[pid].ent) : "";
          if (el.textContent !== v) el.textContent = v;
        });
      }
      function render() {
        if (!S.started && (S.view === "game" || S.view === "summary")) S.view = S.order.length ? "setup" : "squad";
        if (S.theme) document.documentElement.dataset.theme = S.theme;
        else delete document.documentElement.dataset.theme;
        $("#top").innerHTML = header();
        const v = S.view;
        $("#app").innerHTML = v === "squad" ? viewSquad() : v === "setup" ? viewSetup() : v === "game" ? viewGame() : viewSummary();
        $("#layer").innerHTML = layer();
        lastSig = S.view === "game" && S.started ? gameSig() : "";
      }

      /* ---------- Clock tick ---------- */
      let lastSave = 0;
      function tick() {
        if (!S.started) return;
        S.teams.forEach((tm, i) => {
          const t = S.T[tm.id];
          if (!t || t.stage !== "running") return;
          settle(t);
          const c = clock(t);
          const due = nextDue(t);
          if (due != null && c >= due && !t.callType && c - t.halfStart < H()) {
            t.callType = "plan";
            t.toggle = [];
            t.early = false;
            if (!S.T[S.teams[S.active].id].callType) S.active = i;
            alarm(false);
          }
          if (c - t.halfStart >= H() && !t.ot) {
            t.ot = true;
            alarm(true);
          }
        });
        if (S.view === "game") {
          if (gameSig() !== lastSig) render();
          else liveUpdate();
        }
        if (Date.now() - lastSave > 3000) {
          save();
          lastSave = Date.now();
        }
      }
      setInterval(tick, 250);

      /* ---------- Actions ---------- */
      const cur = () => S.T[S.teams[S.active].id];
      const limits = { teams: [1, 6], onField: [3, 15], gameMins: [4, 40], games: [1, 8], halves: [1, 2], outlier: [0.5, 5] };
      const A = {
        go: (d) => {
          S.view = d.v;
          UI.sheet = null;
          UI.modal = null;
        },
        modal: (d) => {
          UI.modal = d.m;
        },
        closeModal: () => {
          UI.modal = null;
        },
        resp: (d) => {
          S.players[d.p].resp = d.r;
          S.teams = [];
        },
        addSquad: () => {
          const name = $("#addName").value.trim();
          if (!name) return;
          applyImport({ rows: [{ name, resp: "going" }] });
        },
        removeSquad: (d) => {
          delete S.players[d.p];
          S.order = S.order.filter((x) => x !== d.p);
          S.teams = [];
        },
        pasteApply: () => {
          const rows = $("#pasteBox")
            .value.split(/\n|,/)
            .map((s) => s.replace(/^\s*\d+[.)]\s*/, "").trim())
            .filter(Boolean)
            .map((name) => ({ name, resp: "going" }));
          applyImport({ rows });
          UI.modal = null;
          toast(`Added ${rows.length} names`);
        },
        toSetup: () => {
          if (!S.teams.length) splitTeams("az");
          S.view = "setup";
        },
        param: (d) => {
          const P = S.params;
          const [lo, hi] = limits[d.k];
          const step = d.k === "outlier" ? 0.5 : 1;
          P[d.k] = Math.min(hi, Math.max(lo, +P[d.k] + step * +d.s));
          if (d.k === "teams") splitTeams("az");
          const hm = P.gameMins / P.halves;
          if (P.interval >= hm) P.interval = 0;
          S.stratPicked = false;
          UI.simCache = {};
        },
        toggleBreak: () => {
          S.params.breakReshuffle = !S.params.breakReshuffle;
          S.stratPicked = false;
          UI.simCache = {};
        },
        pickStrat: (d) => {
          S.params.k = +d.k;
          S.params.interval = +d.i;
          S.stratPicked = true;
        },
        split: (d) => splitTeams(d.m),
        moveChip: (d) => {
          const i = S.teams.findIndex((t) => t.pids.includes(d.p));
          S.teams[i].pids = S.teams[i].pids.filter((x) => x !== d.p);
          S.teams[(i + 1) % S.teams.length].pids.push(d.p);
        },
        startDay: () => startDay(),
        team: (d) => {
          S.active = +d.i;
        },
        kickoff: () => {
          const t = cur();
          pushUndo(t);
          const f = fillPairs(t);
          if (f.length) apply(t, f, "fill");
          Object.values(t.ps).forEach((p) => {
            if (p.st === "field") p.started[t.g] = true;
          });
          t.callType = null;
          t.stage = "running";
          t.res = Date.now();
          t.halfStart = 0;
          t.half = 1;
          t.pi = 0;
          t.snooze = 0;
          t.ot = false;
          wake();
        },
        pause: () => {
          const t = cur();
          pushUndo(t);
          settle(t);
          t.acc = clock(t);
          t.res = null;
          t.stage = "paused";
        },
        resume: () => {
          const t = cur();
          pushUndo(t);
          t.res = Date.now();
          t.stage = "running";
        },
        halftime: () => {
          const t = cur();
          pushUndo(t);
          settle(t);
          t.acc = clock(t);
          t.res = null;
          t.stage = "ht";
          t.callType = "break";
          t.toggle = [];
        },
        secondHalf: () => {
          const t = cur();
          pushUndo(t);
          t.callType = null;
          t.stage = "running";
          t.half = 2;
          t.halfStart = t.acc;
          t.pi = 0;
          t.snooze = 0;
          t.ot = false;
          t.res = Date.now();
          wake();
        },
        fulltime: () => {
          const t = cur();
          pushUndo(t);
          settle(t);
          t.acc = clock(t);
          t.res = null;
          t.stage = "ft";
          t.callType = null;
          t.games[t.g] = { dur: t.acc };
        },
        nextGame: () => {
          const t = cur();
          pushUndo(t);
          t.base += t.acc;
          t.acc = 0;
          t.last = 0;
          t.half = 1;
          t.halfStart = 0;
          t.ot = false;
          if (t.g + 1 >= S.params.games) {
            t.stage = "done";
            S.view = S.teams.every((x) => S.T[x.id].stage === "done") ? "summary" : "game";
          } else {
            t.g++;
            t.stage = "pre";
            t.callType = "break";
            t.toggle = [];
          }
        },
        reopen: () => {
          const t = cur();
          t.callType = "break";
          t.toggle = [];
        },
        subNow: () => {
          const t = cur();
          t.callType = "plan";
          t.toggle = [];
          t.early = true;
        },
        togglePair: (d) => {
          const t = cur();
          t.toggle = t.toggle || [];
          t.toggle = t.toggle.includes(d.p) ? t.toggle.filter((x) => x !== d.p) : t.toggle.concat(d.p);
        },
        callDone: () => {
          const t = cur();
          const sel = callPairs(t).filter((p) => p.chk);
          pushUndo(t);
          apply(t, sel, t.callType === "plan" ? "sub" : "break");
          if (t.callType === "plan") {
            const due = nextDue(t);
            if (!t.early) {
              t.pi++;
              t.snooze = 0;
            } else if (due != null && due - clock(t) < (t.interval * MIN) / 2) {
              t.pi++;
              t.snooze = 0;
            }
          }
          t.callType = null;
          t.early = false;
          if (sel.length) toast(`${sel.length} change${sel.length > 1 ? "s" : ""} made`);
        },
        callSnooze: () => {
          const t = cur();
          if (!t.early) t.snooze += 30000;
          t.callType = null;
        },
        callSkip: () => {
          const t = cur();
          if (t.callType === "plan" && !t.early) {
            t.pi++;
            t.snooze = 0;
          }
          t.callType = null;
          t.early = false;
        },
        fillNow: () => {
          const t = cur();
          pushUndo(t);
          apply(t, fillPairs(t), "fill");
        },
        player: (d) => {
          UI.sheet = { t: d.t, p: d.p };
        },
        closeSheet: () => {
          UI.sheet = null;
        },
        swapWith: (d) => {
          const t = S.T[d.t];
          pushUndo(t);
          const p = t.ps[d.p];
          apply(t, [p.st === "field" ? { off: d.p, on: d.o } : { off: d.o, on: d.p }], "manual");
          UI.sheet = null;
        },
        setst: (d) => {
          const t = S.T[d.t];
          pushUndo(t);
          const was = t.ps[d.p].st;
          setSt(t, d.p, d.s);
          let type = d.s;
          if (d.s === "bench") type = was === "injured" ? "returned" : was === "lent" ? "back" : was === "concussed" ? "cleared" : "arrived";
          if (d.s !== "field") logEv(t, type, { pid: d.p });
          else logEv(t, "manual", { off: null, on: d.p });
          if (was === "field" && t.stage !== "ft" && t.stage !== "done") {
            const f = fillPairs(t).slice(0, 1);
            if (f.length) {
              apply(t, f, "fill");
              toast(`${nm(f[0].on)} on for ${nm(d.p)}`);
            }
          }
          UI.sheet = null;
        },
        moveTeam: (d) => {
          const t = S.T[d.t];
          const t2 = S.T[d.to];
          settle(t);
          settle(t2);
          const ps = t.ps[d.p];
          if (ps.st === "field") ps.st = "bench";
          ps.since = sess(t2);
          t2.ps[d.p] = ps;
          delete t.ps[d.p];
          const a = S.teams.find((x) => x.id === d.t);
          const b = S.teams.find((x) => x.id === d.to);
          a.pids = a.pids.filter((x) => x !== d.p);
          b.pids.push(d.p);
          t.undo = [];
          t2.undo = [];
          toast(`${nm(d.p)} moved to ${b.name}`);
          UI.sheet = null;
        },
        undo: () => {
          const t = cur();
          const snap = t.undo.pop();
          if (!snap) return;
          const u = t.undo;
          Object.keys(t).forEach((k) => delete t[k]);
          Object.assign(t, snap, { undo: u });
          toast("Undone");
        },
        stratOpen: () => {
          const t = cur();
          UI.strat = { k: t.k, iv: t.interval };
          UI.modal = "strat";
        },
        stratStep: (d) => {
          const s = UI.strat;
          const hm = S.params.gameMins / S.params.halves;
          if (d.f === "k") s.k = Math.max(1, Math.min(12, s.k + +d.s));
          else s.iv = Math.max(0, Math.min(Math.ceil(hm) - 1, Math.round(s.iv) + +d.s));
        },
        stratPick: (d) => {
          UI.strat = { k: +d.k, iv: +d.i };
        },
        stratApply: () => {
          const t = cur();
          pushUndo(t);
          t.k = UI.strat.k;
          t.interval = UI.strat.iv;
          if (["running", "paused"].includes(t.stage)) resyncPi(t);
          logEv(t, "plan", { note: stratLabel(t.k, t.interval) });
          UI.modal = null;
          toast("Plan changed: " + stratLabel(t.k, t.interval).toLowerCase());
        },
        addLate: () => {
          const name = $("#addLate").value.trim();
          if (!name) return;
          const t = cur();
          const tm = S.teams[S.active];
          const id = uid();
          S.players[id] = { id, name, resp: "going" };
          S.order.push(id);
          tm.pids.push(id);
          settle(t);
          t.ps[id] = newPS("bench");
          t.ps[id].since = sess(t);
          logEv(t, "arrived", { pid: id });
          UI.modal = null;
          toast(`${name} added to the bench`);
        },
        exportJSON: () => {
          const o = clone(S);
          Object.values(o.T || {}).forEach((t) => (t.undo = []));
          saveFile(`fair-time-${stamp()}.json`, JSON.stringify(o, null, 2));
        },
        exportCSV: () => saveFile(`fair-time-minutes-${stamp()}.csv`, csvText()),
        shareText: async () => {
          const text = summaryText();
          try {
            if (navigator.share) {
              await navigator.share({ title: "Match day summary", text });
              return;
            }
          } catch (e) {
            if (e && e.name === "AbortError") return;
          }
          try {
            await navigator.clipboard.writeText(text);
            toast("Summary copied");
          } catch (e) {
            saveFile(`fair-time-summary-${stamp()}.txt`, text);
          }
        },
        sound: () => {
          S.sound = !S.sound;
          if (S.sound) alarm(false);
        },
        theme: () => {
          S.theme = S.theme === "" ? "light" : S.theme === "light" ? "dark" : "";
        },
        newConfirm: () => {
          const keep = { sound: S.sound, theme: S.theme };
          try {
            localStorage.removeItem(KEY);
          } catch (e) {}
          S = Object.assign(fresh(), keep);
          UI.modal = null;
          UI.sheet = null;
          UI.simCache = {};
          toast("Previous session cleared");
        },
      };
      async function importFileObj(f) {
          try {
            let sheets;
            try {
              sheets = await readSheets(f);
            } catch (e) {
              throw new Error(e && e.message && !/^(LIB|NOT_ZIP|NO_INFLATE)$/.test(e.message) ? e.message : "Couldn't read that file on this device. Use Paste names instead, or send me the file so I can check it.");
            }
            const res = parseWorkbook(sheets);
            if (!res.rows.length) throw new Error("No names found in that file. Export the event participant list from Spond, or use Paste names.");
            applyImport(res);
            const g = res.rows.filter((r) => r.resp === "going").length;
            toast(`Imported ${res.rows.length} names, ${g} going`);
          } catch (e) {
            toast(e.message);
          }
          save();
          render();
        }
      const C = {
        importFile: async (el) => {
          const f = el.files && el.files[0];
          if (!f) return;
          await importFileObj(f);
          el.value = "";
        },
        restoreFile: async (el) => {
          const f = el.files && el.files[0];
          if (!f) return;
          try {
            const o = JSON.parse(await f.text());
            if (!o || o.v !== 1 || !o.params) throw new Error("That file isn't a Fair Time backup.");
            if (!confirm("Restoring replaces everything currently on this device. Continue?")) return;
            Object.values(o.T || {}).forEach((t) => (t.undo = t.undo || []));
            S = o;
            UI.modal = null;
            UI.simCache = {};
            toast("Backup restored");
          } catch (e) {
            toast(e.message || "Couldn't read that file.");
          }
          save();
          render();
        },
        teamName: (el) => {
          S.teams[+el.dataset.i].name = el.value.trim() || "Team";
          save();
        },
      };
      document.addEventListener("click", (e) => {
        unlockAudio();
        const el = e.target.closest("[data-a]");
        if (!el || el.disabled) return;
        const fn = A[el.dataset.a];
        if (!fn) return;
        const r = fn(el.dataset, el, e);
        if (r && r.then) r.then(() => (save(), render()));
        save();
        render();
      });
      document.addEventListener("change", (e) => {
        const el = e.target.closest("[data-ch]");
        if (el && C[el.dataset.ch]) C[el.dataset.ch](el, e);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.id === "addName") A.addSquad(), save(), render();
        if (e.key === "Enter" && e.target.id === "addLate") A.addLate(), save(), render();
        if (e.key === "Escape" && (UI.sheet || UI.modal)) {
          UI.sheet = null;
          UI.modal = null;
          render();
        }
      });
      if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
      async function checkShared() {
        if (!/[?&]shared=1/.test(location.search)) return;
        history.replaceState(null, "", location.pathname);
        try {
          const c = await caches.open("fairtime-share");
          const key = new URL("shared-file", location.href).href;
          const r = await c.match(key);
          if (!r) return;
          const name = decodeURIComponent(r.headers.get("x-name") || "shared.xlsx");
          const file = new File([await r.blob()], name);
          await c.delete(key);
          if (S.started) {
            toast("Match day is under way. Start a new session before importing a new squad.");
            return;
          }
          S.view = "squad";
          await importFileObj(file);
        } catch (e) {
          toast("Couldn't open the shared file. Use Import Spond file instead.");
        }
      }
      render();
      checkShared();
    </script>
  </body>
</html>
